apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-portal-app
  namespace: controller
  labels:
    app: data-portal-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-portal-app
  template:
    metadata:
      labels:
        app: data-portal-app
    spec:
      containers:
      - name: data-portal-app
        image: data-portal-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: data-portal-app-service
  namespace: default
spec:
  selector:
    app: data-portal-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-portal-app-ingress
  namespace: controller
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: portal-app.k8s.tailnet
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: data-portal-app-service
            port:
              number: 80
