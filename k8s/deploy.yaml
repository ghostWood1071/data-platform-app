apiVersion: v1
kind: Secret
metadata:
  name: portal-auth-secret
  namespace: portal
type: Opaque
stringData:
  JWT_SECRET: change-this-jwt-secret-before-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-portal-app
  namespace: portal
  labels:
    app: data-portal-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-portal-app
  template:
    metadata:
      labels:
        app: data-portal-app
    spec:
      serviceAccountName: portal-api-server
      containers:
      - name: data-portal-app
        image: ghostwood/data-platform-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: portal-postgres-secret
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: portal-auth-secret
              key: JWT_SECRET
        - name: KEYCLOAK_ISSUER_URL
          value: "https://keycloak.datalabutehy.com/realms/data-team"
        - name: KEYCLOAK_JWKS_URI
          value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/data-team/protocol/openid-connect/certs"
        - name: KEYCLOAK_ADMIN_BASE_URL
          value: "http://keycloak-service.keycloak.svc.cluster.local:8080"
        - name: KEYCLOAK_REALM
          value: "data-team"
        - name: KEYCLOAK_CLIENT_ID
          value: "data-platform-portal"
        - name: KEYCLOAK_ADMIN_CLIENT_ID
          value: "data-platform-admin-api"
        - name: KEYCLOAK_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: portal-keycloak-admin-secret
              key: KEYCLOAK_ADMIN_CLIENT_SECRET
        - name: APP_ROOT
          value: /app
        - name: SPARK_SCRIPT_DIR
          value: /app/scripts
        volumeMounts:
        - name: spark-portal-env
          mountPath: /app/.env
          subPath: .env
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
      volumes:
      - name: spark-portal-env
        secret:
          secretName: spark-portal-env
---
apiVersion: v1
kind: Service
metadata:
  name: data-portal-app-service
  namespace: portal
spec:
  selector:
    app: data-portal-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: data-portal-app-ingress
  namespace: portal
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: portal-app.k8s.tailnet
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: data-portal-app-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: data-portal-app-service
            port:
              number: 80
  - host: app.datalabutehy.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: data-portal-app-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: data-portal-app-service
            port:
              number: 80
