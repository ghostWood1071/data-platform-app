apiVersion: v1
kind: Secret
metadata:
  name: portal-postgres-secret
  namespace: portal
type: Opaque
stringData:
  POSTGRES_DB: data_platform
  POSTGRES_USER: data_platform
  POSTGRES_PASSWORD: data_platform_password
  DATABASE_URL: postgres://data_platform:data_platform_password@portal-postgres.portal.svc.cluster.local:5432/data_platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-postgres-initdb
  namespace: portal
data:
  001-init.sql: |
    CREATE EXTENSION IF NOT EXISTS pgcrypto;

    CREATE TABLE IF NOT EXISTS "spark_cluster_operations" (
      "id" uuid PRIMARY KEY DEFAULT gen_random_uuid() NOT NULL,
      "action" text NOT NULL,
      "release_name" text NOT NULL,
      "size" text,
      "replicas" integer,
      "status" text NOT NULL,
      "stdout" text,
      "stderr" text,
      "error_message" text,
      "requested_by" text,
      "metadata" jsonb,
      "created_at" timestamp DEFAULT now() NOT NULL,
      "started_at" timestamp,
      "finished_at" timestamp
    );

    CREATE TABLE IF NOT EXISTS "spark_cluster_settings" (
      "id" text PRIMARY KEY DEFAULT 'default' NOT NULL,
      "compute_namespace" text NOT NULL,
      "spark_cluster_image" text NOT NULL,
      "spark_version" text NOT NULL,
      "pyspark_version" text NOT NULL,
      "hive_metastore_uris" text NOT NULL,
      "s3a_endpoint" text NOT NULL,
      "spark_warehouse_dir" text NOT NULL,
      "aws_access_key_id" text NOT NULL,
      "aws_secret_access_key" text NOT NULL,
      "created_at" timestamp DEFAULT now() NOT NULL,
      "updated_at" timestamp DEFAULT now() NOT NULL
    );

    INSERT INTO "spark_cluster_settings" (
      "id",
      "compute_namespace",
      "spark_cluster_image",
      "spark_version",
      "pyspark_version",
      "hive_metastore_uris",
      "s3a_endpoint",
      "spark_warehouse_dir",
      "aws_access_key_id",
      "aws_secret_access_key"
    )
    VALUES (
      'default',
      'compute',
      'ghostwood/spark-notebook:0.0.3',
      '3.5.7',
      '3.5.7',
      'thrift://hive-metastore.metastore.svc.cluster.local:9083',
      'http://minio-svc-private.storage.svc.cluster.local:9000',
      's3a://warehouse/',
      'minioadmin',
      'minioadmin'
    )
    ON CONFLICT ("id") DO NOTHING;

    CREATE TABLE IF NOT EXISTS "platform_services" (
      "id" text PRIMARY KEY NOT NULL,
      "name" text NOT NULL,
      "description" text NOT NULL,
      "namespace" text NOT NULL,
      "status" text DEFAULT 'Running' NOT NULL,
      "url" text NOT NULL,
      "category" text NOT NULL,
      "is_jdbc" boolean DEFAULT false NOT NULL,
      "created_at" timestamp DEFAULT now() NOT NULL,
      "updated_at" timestamp DEFAULT now() NOT NULL
    );

    INSERT INTO "platform_services" (
      "id",
      "name",
      "description",
      "namespace",
      "status",
      "url",
      "category",
      "is_jdbc"
    )
    VALUES
      ('minio', 'MinIO', 'Object Storage', 'storage', 'Running', 'https://minio.k8s.tailnet', 'storage', false),
      ('notebook', 'JupyterHub', 'Notebook Environment', 'notebook', 'Running', 'https://notebook.k8s.tailnet', 'compute', false),
      ('spark-thrift', 'Spark Thrift Server', 'JDBC/Thrift SQL Gateway', 'compute', 'Running', 'jdbc:hive2://spark-thrift.compute.svc.cluster.local:10000/default', 'compute', true),
      ('spark-ui', 'Spark Cluster UI', 'Spark Master UI', 'compute', 'Running', 'https://spark.k8s.tailnet', 'compute', false),
      ('airflow', 'Apache Airflow', 'Workflow Orchestration', 'orchestration', 'Running', 'https://airflow.k8s.tailnet', 'orchestration', false),
      ('kafka', 'Kafka UI', 'Kafka Management UI', 'streaming', 'Running', 'https://kafka.k8s.tailnet', 'streaming', false),
      ('openmetadata', 'OpenMetadata', 'Metadata Catalog', 'metadata', 'Running', 'https://openmetadata.k8s.tailnet', 'metadata', false)
    ON CONFLICT ("id") DO NOTHING;

    CREATE TABLE IF NOT EXISTS "users" (
      "id" uuid PRIMARY KEY DEFAULT gen_random_uuid() NOT NULL,
      "username" text NOT NULL,
      "password_hash" text NOT NULL,
      "full_name" text NOT NULL,
      "email" text NOT NULL,
      "role" text NOT NULL,
      "status" text DEFAULT 'active' NOT NULL,
      "created_at" timestamp DEFAULT now() NOT NULL,
      "updated_at" timestamp DEFAULT now() NOT NULL
    );

    CREATE UNIQUE INDEX IF NOT EXISTS "users_username_unique" ON "users" ("username");
    CREATE UNIQUE INDEX IF NOT EXISTS "users_email_unique" ON "users" ("email");

    INSERT INTO "users" (
      "username",
      "password_hash",
      "full_name",
      "email",
      "role",
      "status"
    )
    VALUES (
      'admin',
      'scrypt$16384$8$1$data-platform-default-admin$368add8fa5e8e5cb808fe5ad3caa36cc6f6811369998776eb4c64646bf829d52bfa298903720d74a3c55b195a0db928a36a2db3e2fcd6bd8b5562628a1d2c1f8',
      'Administrator',
      'admin@platform.local',
      'platform_admin',
      'active'
    )
    ON CONFLICT ("username") DO NOTHING;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-postgres-data
  namespace: portal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-postgres
  namespace: portal
  labels:
    app: portal-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-postgres
  template:
    metadata:
      labels:
        app: portal-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: portal-postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: portal-postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portal-postgres-data
        - name: initdb
          configMap:
            name: portal-postgres-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: portal-postgres
  namespace: portal
spec:
  selector:
    app: portal-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
