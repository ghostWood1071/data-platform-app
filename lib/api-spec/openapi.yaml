openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Data Platform Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: clusters
    description: Spark cluster management
  - name: services
    description: Platform services catalog
  - name: users
    description: User management
  - name: roles
    description: Role management
  - name: audit
    description: Audit log operations
  - name: dashboard
    description: Dashboard summary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: User logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard overview summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /clusters/spark:
    get:
      operationId: getSparkCluster
      tags: [clusters]
      summary: Get Spark cluster status
      responses:
        "200":
          description: Spark cluster info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SparkCluster"

  /clusters/spark/start:
    post:
      operationId: startSparkCluster
      tags: [clusters]
      summary: Start Spark cluster
      responses:
        "200":
          description: Cluster start initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /clusters/spark/stop:
    post:
      operationId: stopSparkCluster
      tags: [clusters]
      summary: Stop Spark cluster
      responses:
        "200":
          description: Cluster stop initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /clusters/spark/scale:
    post:
      operationId: scaleSparkCluster
      tags: [clusters]
      summary: Scale Spark cluster workers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaleInput"
      responses:
        "200":
          description: Scale initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /clusters/spark/pods:
    get:
      operationId: getSparkPods
      tags: [clusters]
      summary: Get Spark pods list
      responses:
        "200":
          description: List of Spark pods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SparkPod"

  /clusters/spark/events:
    get:
      operationId: getSparkEvents
      tags: [clusters]
      summary: Get Spark cluster events
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClusterEvent"

  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: Get platform services catalog
      responses:
        "200":
          description: List of platform services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformService"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/toggle:
    post:
      operationId: toggleUserStatus
      tags: [users]
      summary: Enable or disable user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleUserInput"
      responses:
        "200":
          description: Status toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /roles:
    get:
      operationId: getRoles
      tags: [roles]
      summary: List all roles with permissions
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"

  /audit:
    get:
      operationId: getAuditLogs
      tags: [audit]
      summary: Get recent audit logs
      responses:
        "200":
          description: Recent audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        rememberMe:
          type: boolean

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, username, fullName, email, role, status, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
          enum: [active, disabled]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [username, fullName, email, role]
      properties:
        username:
          type: string
        fullName:
          type: string
        email:
          type: string
        role:
          type: string
        password:
          type: string

    UserUpdate:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
        role:
          type: string

    ToggleUserInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    Role:
      type: object
      required: [name, description, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    DashboardSummary:
      type: object
      required: [services, clusterStatus, workerCount, recentActivity]
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceStatus"
        clusterStatus:
          type: string
        workerCount:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"

    ServiceStatus:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [Running, Stopped, Unknown]
        description:
          type: ["string", "null"]

    SparkCluster:
      type: object
      required: [clusterName, namespace, masterStatus, workerStatus, currentWorkerReplicas, desiredWorkerReplicas, sparkMasterUrl, sparkUiUrl]
      properties:
        clusterName:
          type: string
        namespace:
          type: string
        masterStatus:
          type: string
        workerStatus:
          type: string
        currentWorkerReplicas:
          type: integer
        desiredWorkerReplicas:
          type: integer
        sparkMasterUrl:
          type: string
        sparkUiUrl:
          type: string

    ScaleInput:
      type: object
      required: [workerCount]
      properties:
        workerCount:
          type: integer

    ActionResult:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
        message:
          type: string

    SparkPod:
      type: object
      required: [podName, role, status, node, cpu, memory, age]
      properties:
        podName:
          type: string
        role:
          type: string
          enum: [master, worker]
        status:
          type: string
        node:
          type: string
        cpu:
          type: string
        memory:
          type: string
        age:
          type: string

    ClusterEvent:
      type: object
      required: [type, reason, message, timestamp]
      properties:
        type:
          type: string
        reason:
          type: string
        message:
          type: string
        timestamp:
          type: string

    PlatformService:
      type: object
      required: [id, name, description, namespace, status, url, category]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        namespace:
          type: string
        status:
          type: string
          enum: [Running, Stopped, Unknown]
        url:
          type: string
        category:
          type: string
        isJdbc:
          type: ["boolean", "null"]

    AuditLog:
      type: object
      required: [id, actor, action, timestamp]
      properties:
        id:
          type: string
        actor:
          type: string
        action:
          type: string
        timestamp:
          type: string
        details:
          type: ["string", "null"]
